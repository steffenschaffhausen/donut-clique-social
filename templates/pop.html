<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Luckiest Guy";src:url(fonts/luckiest-guy-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:700;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:800;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:900;src:url(fonts/nunito-latin-900-normal.woff2) format("woff2")}
:root{--ink:#1d1d1b;--cream:#fff6e6;--coral:#ff7a5c;--mustard:#e8b22c;--petrol:#1f6f78;--mint:#7fd6b5;--display:"Luckiest Guy",Impact,sans-serif;--sans:Nunito,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#000}
#root{position:relative;width:1080px;height:var(--H,1350px);overflow:hidden;font-family:var(--sans);color:var(--ink)}
.slide{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.abs{position:absolute}
/* backgrounds */
.rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg at var(--rx,50%) var(--ry,50%),var(--bg) 0 6deg,var(--bg2) 6deg 12deg)}
.dots{position:absolute;inset:0;background:radial-gradient(circle,var(--dot) 32%,transparent 34%) 0 0/26px 26px;-webkit-mask-image:linear-gradient(var(--dm,160deg),#000 0%,transparent 70%);mask-image:linear-gradient(var(--dm,160deg),#000 0%,transparent 70%)}
.dots.b{-webkit-mask-image:linear-gradient(-20deg,#000 0%,transparent 55%);mask-image:linear-gradient(-20deg,#000 0%,transparent 55%)}
.speed{position:absolute;inset:0;background:repeating-linear-gradient(var(--sa,-12deg),transparent 0 46px,rgba(255,246,230,.22) 46px 52px)}
/* type */
.big{font:400 var(--fs,120px)/0.95 var(--display);color:var(--tc,var(--cream));-webkit-text-stroke:var(--st,13px) var(--ink);paint-order:stroke fill;text-shadow:var(--ts,10px) var(--ts,10px) 0 var(--ink);letter-spacing:.01em;margin:0}
.box{display:inline-block;background:#f8e3a6;border:8px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:14px 26px;font:900 36px/1.15 var(--sans);text-transform:uppercase;letter-spacing:.03em}
.small{font:900 46px/1.2 var(--sans);color:var(--tc,var(--cream));-webkit-text-stroke:8px var(--ink);paint-order:stroke fill}
/* parts */
.fig svg,.headc svg{display:block;width:100%;height:100%}
.fig{filter:drop-shadow(12px 12px 0 var(--ink))}
.headc{border-radius:50%;border:9px solid var(--ink);overflow:hidden;background:var(--hb);box-shadow:8px 8px 0 var(--ink)}
.burst{display:flex;align-items:center;justify-content:center}
.burst svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.burst span{position:relative;font:400 var(--bf,80px)/0.95 var(--display);color:var(--btc,var(--ink));text-align:center;-webkit-text-stroke:var(--bst,0px) var(--ink);paint-order:stroke fill;padding:0 12%}
.balloon{background:#fff;border:9px solid var(--ink);border-radius:56px;padding:30px 40px;font:900 50px/1.18 var(--sans);box-shadow:10px 10px 0 var(--ink)}
.balloon .tail{position:absolute;width:120px;height:110px;overflow:visible}
.host{position:absolute;left:40px;top:40px;display:flex;align-items:center;gap:0;z-index:20}
.host .headc{width:104px;height:104px;border-width:7px;box-shadow:5px 5px 0 var(--ink);position:relative;z-index:2}
.host b{margin-left:-22px;background:var(--ink);color:var(--cream);font:900 28px var(--sans);letter-spacing:.08em;padding:12px 22px 12px 36px;border-radius:0 999px 999px 0;text-transform:uppercase}
.count{position:absolute;right:40px;top:58px;z-index:20;background:var(--cream);border:6px solid var(--ink);border-radius:999px;font:900 30px var(--sans);padding:8px 22px;box-shadow:5px 5px 0 var(--ink)}
.swipe{position:absolute;right:40px;bottom:46px;z-index:20;background:var(--coral);color:var(--cream);border:7px solid var(--ink);border-radius:999px;font:400 40px var(--display);padding:16px 30px 8px;box-shadow:6px 6px 0 var(--ink);transform:rotate(-3deg)}
.brand{position:absolute;left:40px;bottom:46px;z-index:20;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--cream);font:400 36px var(--display);padding:12px 24px 8px 14px;border-radius:999px;transform:rotate(-2deg)}
.brand svg{width:52px;height:52px;margin-top:-4px}
.paper{background:#fffdf6;border:9px solid var(--ink);border-radius:16px;box-shadow:14px 14px 0 var(--ink);padding:56px 56px 48px;background-image:repeating-linear-gradient(transparent 0 63px,#cfe7e6 63px 67px);background-position:0 36px}
.paper h3{font:400 70px/1 var(--display);margin:0 0 22px}
.paper p{margin:0;font:800 40px/67px var(--sans);min-height:67px;white-space:pre}
.tape{position:absolute;top:-34px;left:50%;width:220px;height:62px;margin-left:-110px;background:rgba(232,178,44,.85);border:5px solid var(--ink);transform:rotate(3deg)}
.card{background:#fff;border:9px solid var(--ink);border-radius:30px;box-shadow:14px 14px 0 var(--ink)}
.row{display:flex;align-items:center;gap:22px;padding:20px 0;font:800 42px/1.2 var(--sans)}
.row+.row{border-top:5px dashed #d6cdbb}
.row .l{flex:1}
.row .v{font:400 54px var(--display)}
.meter{display:flex;gap:6px}
.meter i{width:30px;height:46px;border:5px solid var(--ink);border-radius:6px;background:#eee6d6;transform:skewX(-8deg)}
.meter i.on{background:var(--mc,var(--coral))}
.poly{background:#fff;border:7px solid var(--ink);padding:22px 22px 30px;box-shadow:8px 8px 0 var(--ink);font:900 40px/1.15 var(--sans);text-align:center}
.pin{position:absolute;top:-22px;left:50%;margin-left:-20px;width:40px;height:40px;border-radius:50%;background:#b8432a;border:6px solid var(--ink)}
.msg{display:flex;align-items:flex-end;gap:16px}
.msg .headc{width:96px;height:96px;border-width:7px;box-shadow:4px 4px 0 var(--ink);flex:none}
.msg .say{background:#fff;border:7px solid var(--ink);border-radius:30px 30px 30px 8px;padding:16px 28px;font:900 46px/1.15 var(--sans);box-shadow:6px 6px 0 var(--ink)}
.msg .say i{display:block;font:900 26px var(--sans);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--nc)}
.msg.me{justify-content:flex-end}
.msg.me .say{background:var(--coral);color:var(--cream);border-radius:30px 30px 8px 30px}
.scene svg{display:block;width:100%;height:100%}
.chip{display:inline-block;background:var(--ink);color:var(--cream);font:900 34px var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:12px 26px;border-radius:999px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const C = {
  coral:{bg:'#ff7a5c',bg2:'#ff9074',dot:'rgba(29,29,27,.16)'}, mustard:{bg:'#e8b22c',bg2:'#f1c444',dot:'rgba(29,29,27,.15)'},
  petrol:{bg:'#1f6f78',bg2:'#26808a',dot:'rgba(255,246,230,.14)'}, mint:{bg:'#7fd6b5',bg2:'#97e2c6',dot:'rgba(29,29,27,.13)'},
  cream:{bg:'#fff6e6',bg2:'#ffe9c2',dot:'rgba(29,29,27,.10)'}, sky:{bg:'#bfe3df',bg2:'#d2eeea',dot:'rgba(29,29,27,.11)'},
  night:{bg:'#16324a',bg2:'#1c3d58',dot:'rgba(255,246,230,.10)'}, cork:{bg:'#c8955a',bg2:'#cf9e66',dot:'rgba(29,29,27,.14)'},
  pink:{bg:'#ffd9cf',bg2:'#ffe6de',dot:'rgba(29,29,27,.10)'}
};
const FR = { mila:{bg:'#cfe7e6',fg:'#1f6f78'}, jonas:{bg:'#ffd9cf',fg:'#b8432a'}, aysha:{bg:'#f8e3a6',fg:'#8a6510'}, leo:{bg:'#7fd6b5',fg:'#1f6f78'}, vreni:{bg:'#fff6e6',fg:'#a8452c'} };
const NAMES = { mila:'Mila', jonas:'Jonas', aysha:'Aysha', leo:'Leo', vreni:'Tante Vreni', me:'Du' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
let seed = 1; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const UNITLESS = { 'z-index': 1, opacity: 1, 'line-height': 1 };
const st = o => Object.entries(o).filter(e => e[1] !== undefined).map(([k, v]) => k + ':' + (typeof v === 'number' && !UNITLESS[k] ? v + 'px' : v)).join(';');

function portrait(who, head) { return '<svg viewBox="' + (head ? '36 24 128 128' : '0 0 200 240') + '" xmlns="http://www.w3.org/2000/svg" overflow="visible">' + (window.P[who] || '') + '</svg>'; }
function head(who, size, extra) { return '<div class="headc ' + (extra && extra.cls || '') + '" style="' + st({ width: size, height: size, '--hb': FR[who].bg }) + ';' + (extra && extra.style || '') + '">' + portrait(who, true) + '</div>'; }
function fig(who, o) { // big bust: o = {x, y(bottom), w, rot, cls}
  return '<div class="abs fig ' + (o.cls || '') + '" style="' + st({ left: o.x, bottom: o.y || 0, width: o.w, height: o.w * 1.2, transform: 'rotate(' + (o.rot || 0) + 'deg)', 'transform-origin': '50% 100%', 'z-index': o.z || 5 }) + '">' + portrait(who) + '</div>';
}
function burstPath(n, jitter) {
  seed = n * 97 + 13; let d = '';
  for (let i = 0; i < n * 2; i++) {
    const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2;
    const r = i % 2 ? 36 + rnd() * jitter : 50 - rnd() * 3;
    d += (i ? 'L' : 'M') + (50 + Math.cos(a) * r).toFixed(1) + ' ' + (50 + Math.sin(a) * r * 0.82).toFixed(1);
  }
  return d + 'Z';
}
function burst(text, o) { // o = {x, y, w, h, rot, fill, fs, tc, n, cls}
  const w = o.w || 420, h = o.h || w * 0.8;
  return '<div class="abs burst ' + (o.cls || '') + '" style="' + st({ left: o.x, top: o.y, width: w, height: h, transform: 'rotate(' + (o.rot || -8) + 'deg)', '--bf': (o.fs || 84) + 'px', '--btc': o.tc || '#1d1d1b', '--bst': o.tc && o.tc !== '#1d1d1b' ? '9px' : '0px', 'z-index': o.z || 12 }) + '"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="' + burstPath(o.n || 14, 8) + '" transform="translate(3 3)" fill="#1d1d1b"/><path d="' + burstPath(o.n || 14, 8) + '" fill="' + (o.fill || '#e8b22c') + '" stroke="#1d1d1b" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke" style="stroke-width:9px"/></svg><span>' + nl(text) + '</span></div>';
}
function balloon(text, o) { // o = {x, y, w, tail:'bl'|'br'|'b', fs}
  const tails = { bl: 'left:90px;bottom:-104px', br: 'right:90px;bottom:-104px', b: 'left:45%;bottom:-104px' };
  const flip = o.tail === 'br' ? ' transform="scale(-1 1) translate(-120 0)"' : '';
  return '<div class="abs balloon ' + (o.cls || '') + '" style="' + st({ left: o.x, top: o.y, width: o.w, 'font-size': (o.fs || 50) + 'px', 'z-index': 14 }) + '">' + nl(text) +
    '<svg class="tail" style="' + tails[o.tail || 'bl'] + '" viewBox="0 0 120 110"><path' + flip + ' d="M10 0 L70 0 L18 104 Z" fill="#fff" stroke="#1d1d1b" stroke-width="9" stroke-linejoin="round"/><rect' + flip + ' x="4" y="-12" width="76" height="16" fill="#fff"/></svg></div>';
}
function bg(color, o) { o = o || {}; const c = C[color]; return (o.rays === false ? '' : '<div class="rays" style="' + st({ '--rx': o.rx || '62%', '--ry': o.ry || '58%' }) + '"></div>') + (o.speed ? '<div class="speed" style="--sa:' + o.speed + 'deg"></div>' : '') + '<div class="dots" style="--dot:' + c.dot + '"></div><div class="dots b" style="--dot:' + c.dot + '"></div>'; }
function sceneBand(key, o) { // scene background, sliced into a band
  return '<div class="abs scene" style="' + st({ left: 0, top: o.top || 0, width: 1080, height: o.h, 'z-index': 1 }) + '">' + window.S[key].replace(/<div class="scene"[^>]*>|<\/div>$/g, '').replace(/preserveAspectRatio="[^"]*"/, 'preserveAspectRatio="xMidY' + (o.align || 'Max') + ' slice"') + '</div>';
}
const LOGO = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#e8a961" stroke="#fff6e6" stroke-width="7"/><path d="M14 46 Q20 18 50 14 Q82 16 87 46 Q78 40 70 48 Q60 40 50 48 Q40 40 30 48 Q22 40 14 46Z" fill="#ff7a5c" stroke="#fff6e6" stroke-width="5" stroke-linejoin="round"/><circle cx="50" cy="50" r="13" fill="#1d1d1b" stroke="#fff6e6" stroke-width="6"/></svg>';
function chrome(n, total) {
  return '<div class="host">' + head('leo', 104) + '<b>Leo erzählt</b></div>' + (total > 1 ? '<div class="count">' + n + '/' + total + '</div>' : '') +
    '<div class="brand">' + LOGO + 'Die Donut Clique</div>' + (total > 1 && n === 1 ? '<div class="swipe">Wischen →</div>' : '');
}
function wrap(color, inner, o) { const c = C[color]; return '<div class="slide" style="' + st({ '--bg': c.bg, '--bg2': c.bg2 }) + '">' + bg(color, o) + inner + '</div>'; }

/* ---------- slide layouts ---------- */
const L = {
  hero: s => wrap(s.bg, (s.who ? fig(s.who, { x: s.fx !== undefined ? s.fx : 300, w: s.fw || 820, rot: s.rot !== undefined ? s.rot : 4 }) : '') +
    '<div class="abs" style="left:56px;top:200px;width:' + (s.tw || 760) + 'px;z-index:10"><h1 class="big" style="--fs:' + (s.fs || 124) + 'px">' + nl(s.title) + '</h1>' + (s.sub ? '<div class="box" style="margin-top:34px;transform:rotate(-2deg)">' + nl(s.sub) + '</div>' : '') + '</div>' +
    (s.burst ? burst(s.burst, { x: s.bx || 40, y: s.by || 830, w: s.bw || 400, fs: s.bfs || 88, fill: s.bfill, rot: -10 }) : ''), { rx: '68%', ry: '78%' }),

  stat: s => wrap(s.bg, '<div class="abs" style="left:56px;top:190px;width:968px;z-index:10"><h2 class="big" style="--fs:' + (s.fs || 96) + 'px">' + nl(s.title) + '</h2></div>' +
    '<div class="abs card" style="left:56px;top:' + (s.cardTop || 470) + 'px;width:968px;padding:20px 48px;transform:rotate(-1.5deg);z-index:9">' +
    s.rows.map(r => '<div class="row"><span class="l">' + nl(r[0]) + '</span>' + (typeof r[1] === 'number' ? '<span class="meter" style="--mc:' + (r[2] || '#ff7a5c') + '">' + Array.from({ length: 10 }, (_, i) => '<i class="' + (i < r[1] ? 'on' : '') + '"></i>').join('') + '</span><span class="v" style="width:120px;text-align:right">' + (r[3] || r[1] + '/10') + '</span>' : '<span class="v">' + nl(r[1]) + '</span>') + '</div>').join('') + '</div>' +
    (s.who ? '<div class="abs" style="right:70px;top:' + ((s.cardTop || 470) - 150) + 'px;z-index:11;transform:rotate(6deg)">' + head(s.who, 190) + '</div>' : '') +
    (s.burst ? burst(s.burst, { x: s.bx || 560, y: s.by || 1010, w: s.bw || 460, fs: s.bfs || 66, fill: s.bfill || '#fff6e6', rot: -6 }) : ''), { rays: false, speed: -14 }),

  note: s => wrap(s.bg, '<div class="abs" style="left:70px;top:' + (s.top || 230) + 'px;width:940px;transform:rotate(' + (s.rot || -2.5) + 'deg);z-index:8"><div class="paper" style="position:relative"><div class="tape"></div><h3>' + nl(s.title) + '</h3>' + s.lines.map(l => '<p>' + esc(l) + '</p>').join('') + '</div></div>' +
    (s.who ? '<div class="abs" style="left:56px;bottom:150px;z-index:11;transform:rotate(-6deg)">' + head(s.who, 170) + '</div>' : '') +
    (s.stamp ? burst(s.stamp, { x: s.sx || 520, y: s.sy || 990, w: s.sw || 500, fs: s.sfs || 58, fill: s.sfill || '#ff7a5c', tc: '#fff6e6', rot: -9, n: 12 }) : ''), { rx: '50%', ry: '45%' }),

  vs: s => '<div class="slide" style="--bg:#ff7a5c;--bg2:#ff9074"><div class="abs" style="inset:0;background:#1f6f78;clip-path:polygon(58% 0,100% 0,100% 100%,42% 100%)"></div><div class="dots" style="--dot:rgba(29,29,27,.16)"></div>' +
    '<div class="abs" style="left:0;right:0;top:190px;text-align:center;z-index:10"><h2 class="big" style="--fs:100px">' + nl(s.title) + '</h2></div>' +
    [s.left, s.right].map((x, i) => '<div class="abs card" style="' + st({ left: i ? 580 : 60, top: 430, width: 440, padding: '40px 20px', 'text-align': 'center', transform: 'rotate(' + (i ? 3 : -3) + 'deg)', 'z-index': 9 }) + '"><div class="chip">' + esc(x[0]) + '</div><div style="font:400 150px/1 var(--display);margin-top:30px;color:' + (i ? '#1f6f78' : '#b8432a') + '">' + esc(x[1]) + '</div><div style="font:800 34px var(--sans);margin-top:12px">' + nl(x[2] || '') + '</div></div>').join('') +
    burst('VS', { x: 400, y: 560, w: 280, fs: 110, fill: '#e8b22c', rot: -8, n: 12, z: 13 }) +
    '<div class="abs" style="left:60px;right:240px;top:1010px;z-index:10;text-align:center"><div class="box" style="font-size:40px;transform:rotate(-1.5deg)">' + nl(s.verdict) + '</div></div>' +
    (s.who ? '<div class="abs" style="right:50px;top:960px;z-index:12;transform:rotate(8deg)">' + head(s.who, 170) + '</div>' : '') + '</div>',

  caption: s => wrap(s.bg, (s.scene ? sceneBand(s.scene, { top: 0, h: 1350, align: s.align || 'Max' }) + '<div class="abs" style="inset:0;background:' + (s.veil || 'rgba(29,29,27,.35)') + ';z-index:2"></div>' : '') +
    '<div class="abs" style="left:60px;right:60px;top:' + (s.top || 300) + 'px;z-index:10">' + (s.box ? '<div class="box" style="transform:rotate(-2deg);margin-bottom:40px">' + nl(s.box) + '</div>' : '') +
    '<h2 class="big" style="--fs:' + (s.fs || 118) + 'px">' + nl(s.big) + '</h2>' + (s.small ? '<div class="small" style="margin-top:44px">' + nl(s.small) + '</div>' : '') + '</div>' +
    (s.who ? fig(s.who, { x: s.fx !== undefined ? s.fx : 600, w: s.fw || 520, rot: 6, z: 6 }) : '') +
    (s.burst ? burst(s.burst, { x: s.bx || 560, y: s.by || 100, w: s.bw || 440, fs: s.bfs || 80, fill: s.bfill, rot: 8 }) : ''), { rx: '50%', ry: '100%', rays: s.rays }),

  pov: s => '<div class="slide" style="--bg:#efe5cf;--bg2:#efe5cf">' + sceneBand(s.scene, { top: 0, h: s.bandH || 820, align: 'Max' }) +
    '<div class="abs" style="left:0;right:0;top:' + ((s.bandH || 820) - 2) + 'px;bottom:0;background:' + (s.floor || '#e9dcc0') + ';border-top:9px solid #1d1d1b;z-index:1"></div><div class="dots b" style="--dot:rgba(29,29,27,.12);z-index:2"></div>' +
    fig(s.who, { x: s.fx !== undefined ? s.fx : 250, w: s.fw || 800, rot: s.rot || 0, z: 6 }) +
    '<div class="abs" style="left:56px;top:176px;z-index:15;transform:rotate(-2deg)"><div class="box" style="background:#ff7a5c;color:#fff6e6;font-size:40px">' + nl(s.pov) + '</div></div>' +
    balloon(s.say, { x: s.sx || 56, y: s.sy || 330, w: s.sw || 600, tail: s.tail || 'br', fs: s.sfs || 48 }) +
    (s.burst ? burst(s.burst, { x: s.bx || 720, y: s.by || 330, w: s.bw || 320, fs: s.bfs || 70, rot: 10 }) : '') + '</div>',

  grid4: s => wrap(s.bg, '<div class="abs" style="left:56px;right:56px;top:180px;z-index:10;text-align:center"><h2 class="big" style="--fs:' + (s.fs || 92) + 'px">' + nl(s.title) + '</h2></div>' +
    s.items.map((it, i) => { const c = ['mint', 'pink', 'mustard', 'sky'][i]; return '<div class="abs card" style="' + st({ left: 56 + (i % 2) * 494, top: (s.gridTop || 420) + Math.floor(i / 2) * 400, width: 474, height: 380, background: FR[it[0]].bg, transform: 'rotate(' + [-2, 2, 1.5, -1.5][i] + 'deg)', overflow: 'visible', 'z-index': 8 }) + '">' +
      '<div class="abs" style="left:24px;top:24px">' + head(it[0], 150) + '</div>' + burst(it[1], { x: 200, y: -10, w: 270, h: 170, fs: it[1].length > 7 ? 40 : 54, fill: ['#fff6e6', '#e8b22c', '#ff7a5c', '#7fd6b5'][i], rot: 8, n: 12 }) +
      '<div class="abs" style="left:28px;right:24px;top:196px;font:900 ' + (s.ifs || 38) + 'px/1.2 var(--sans)">' + nl(it[2]) + '</div></div>'; }).join(''), { rx: '50%', ry: '62%' }),

  board: s => wrap('cork', '<div class="abs" style="left:0;right:0;top:176px;text-align:center;z-index:10"><h2 class="big" style="--fs:96px">' + nl(s.title) + '</h2></div>' +
    '<svg class="abs" style="left:0;top:0;z-index:9" width="1080" height="1350"><g stroke="#b8432a" stroke-width="7" stroke-linecap="round">' + s.items.map(it => '<line x1="540" y1="770" x2="' + (it[1] + 170) + '" y2="' + (it[2] + 20) + '"/>').join('') + '</g></svg>' +
    s.items.map((it, i) => '<div class="abs poly" style="' + st({ left: it[1], top: it[2], width: 340, transform: 'rotate(' + it[3] + 'deg)', 'z-index': 10 }) + '"><div class="pin"></div>' + nl(it[0]) + '</div>').join('') +
    burst(s.center, { x: 390, y: 660, w: 300, fs: 110, fill: '#ff7a5c', tc: '#fff6e6', rot: -6, n: 12, z: 11 }), { rays: false }),

  group: s => wrap(s.bg, '<div class="abs" style="left:56px;right:56px;top:330px;text-align:center;z-index:10"><h1 class="big" style="--fs:' + (s.fs || 140) + 'px">' + nl(s.title) + '</h1>' + (s.sub ? '<div class="box" style="margin-top:40px;transform:rotate(-1.5deg)">' + nl(s.sub) + '</div>' : '') + '</div>' +
    confetti(40) + s.heads.map((w, i) => '<div class="abs" style="' + st({ left: 40 + i * 255, top: 860 + [0, 50, 10, 60][i], transform: 'rotate(' + [-8, 5, -4, 9][i] + 'deg)', 'z-index': 11 }) + '">' + head(w, 230) + '</div>').join('') +
    (s.burst ? burst(s.burst, { x: s.bx || 650, y: s.by || 120, w: 380, h: 250, fs: 64, fill: s.bfill || '#fff6e6', rot: 8 }) : ''), { rx: '50%', ry: '50%' }),
};
function confetti(n) { seed = 7; let h = ''; const cols = ['#ff7a5c', '#e8b22c', '#7fd6b5', '#fff6e6', '#1f6f78'];
  for (let i = 0; i < n; i++) h += '<i class="abs" style="' + st({ left: Math.round(rnd() * 1040), top: Math.round(rnd() * 1250), width: 18, height: 46, background: cols[i % 5], border: '5px solid #1d1d1b', 'border-radius': '10px', transform: 'rotate(' + Math.round(rnd() * 180) + 'deg)', 'z-index': 3 }) + '"></i>';
  return h; }

window.renderSlide = function (s, n, total) {
  document.getElementById('root').style.setProperty('--H', '1350px');
  document.getElementById('root').innerHTML = L[s.t](s) + chrome(n, total);
  return document.fonts.ready.then(() => true);
};

/* ---------- reels: shots with Web Animations, stepped frame by frame ---------- */
window.reelShots = null; let curShot = -1, anims = [];
window.loadReel = function (shots) { window.reelShots = shots; curShot = -1; document.getElementById('root').style.setProperty('--H', '1920px'); return document.fonts.ready; };
window.reelDuration = () => window.reelShots.reduce((a, s) => a + s.dur, 0);
const PRESET = {
  pop: [{ transform: 'scale(0) rotate(-20deg)', opacity: 0 }, { transform: 'scale(1.18) rotate(4deg)', opacity: 1, offset: .7 }, { transform: 'scale(1) rotate(0)', opacity: 1 }],
  slam: [{ transform: 'scale(3.2)', opacity: 0 }, { transform: 'scale(.92)', opacity: 1, offset: .75 }, { transform: 'scale(1)', opacity: 1 }],
  up: [{ transform: 'translateY(900px)' }, { transform: 'translateY(-30px)', offset: .8 }, { transform: 'translateY(0)' }],
  down: [{ transform: 'translateY(-700px)' }, { transform: 'translateY(0)' }],
  left: [{ transform: 'translateX(1200px)' }, { transform: 'translateX(-30px)', offset: .8 }, { transform: 'translateX(0)' }],
  right: [{ transform: 'translateX(-1200px)' }, { transform: 'translateX(30px)', offset: .8 }, { transform: 'translateX(0)' }],
  fade: [{ opacity: 0 }, { opacity: 1 }],
  zoom: [{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }],
  shake: [{ transform: 'translate(0,0)' }, { transform: 'translate(-18px,8px) rotate(-1deg)' }, { transform: 'translate(16px,-10px) rotate(1deg)' }, { transform: 'translate(-12px,6px)' }, { transform: 'translate(10px,-4px)' }, { transform: 'translate(0,0)' }],
  wiggle: [{ transform: 'rotate(-4deg)' }, { transform: 'rotate(4deg)' }, { transform: 'rotate(-4deg)' }],
  doorUp: [{ transform: 'translateY(0)' }, { transform: 'translateY(-105%)' }],
  flash: [{ opacity: 0 }, { opacity: .95, offset: .2 }, { opacity: 0 }],
};
window.reelFrame = function (t) {
  let acc = 0, i = 0; const shots = window.reelShots;
  while (i < shots.length - 1 && t >= acc + shots[i].dur) { acc += shots[i].dur; i++; }
  const local = t - acc, sh = shots[i], root = document.getElementById('root');
  if (i !== curShot) {
    if (sh.els && !sh.html) { const b = window.buildEls(sh.els); sh.html = b.html; sh.anims = b.anims; }
    curShot = i; root.innerHTML = '<div class="slide" style="--bg:' + C[sh.bg || 'cream'].bg + ';--bg2:' + C[sh.bg || 'cream'].bg2 + '">' + (sh.plain ? '' : bg(sh.bg || 'cream', { rx: '50%', ry: '55%', rays: sh.rays, speed: sh.speed })) + sh.html + '</div>';
    anims = [];
    (sh.anims || []).forEach(a => root.querySelectorAll(a[0]).forEach(el => {
      if (a[1] === 'count') { anims.push({ count: true, el: el.querySelector('h1,h2,.small,span') || el, from: a[2], to: a[3], delay: a[4], dur: a[5] }); return; }
      if (a[1] === 'type') { const te = el.querySelector('h1,h2,.small,span') || el; anims.push({ type: true, el: te, text: te.textContent, delay: a[2], dur: a[3] }); return; }
      const an = el.animate(PRESET[a[1]] || a[1], { delay: a[2] || 0, duration: a[3] || 400, fill: 'both', easing: a[4] || 'cubic-bezier(.2,.8,.3,1)', iterations: a[5] || 1 });
      an.pause(); anims.push(an);
    }));
  }
  anims.forEach(a => {
    if (a.count) { const p = Math.max(0, Math.min(1, (local - a.delay) / a.dur)); a.el.textContent = Math.round(a.from + (a.to - a.from) * (1 - Math.pow(1 - p, 3))).toLocaleString('de-CH').replace(/[’,]/g, "'"); }
    else if (a.type) { const p = Math.max(0, Math.min(1, (local - a.delay) / a.dur)); a.el.textContent = a.text.slice(0, Math.round(a.text.length * p)); }
    else a.currentTime = local;
  });
};
/* reel elements: each sits in its own wrapper box (#eN) so the animation does not fight the element's own rotation */
function elInner(e) {
  switch (e.k) {
    case 'big': return '<h2 class="big" style="' + st({ '--fs': (e.fs || 120) + 'px', '--tc': e.tc, 'text-align': e.align || 'left' }) + '">' + nl(e.text) + '</h2>';
    case 'small': return '<div class="small" style="' + st({ 'font-size': (e.fs || 52) + 'px', '--tc': e.tc, 'text-align': e.align || 'left' }) + '">' + nl(e.text) + '</div>';
    case 'box': return '<div class="box" style="' + st({ transform: 'rotate(' + (e.rot || -2) + 'deg)', 'font-size': (e.fs || 44) + 'px', background: e.bg, color: e.c }) + '">' + nl(e.text) + '</div>';
    case 'burst': return burst(e.text, { x: 0, y: 0, w: e.w, h: e.h, fs: e.fs, fill: e.fill, tc: e.tc, rot: e.rot, n: e.n });
    case 'fig': return fig(e.who, { x: 0, y: 0, w: e.w, rot: e.rot || 0 });
    case 'head': return head(e.who, e.w, { style: 'transform:rotate(' + (e.rot || 0) + 'deg)' });
    case 'balloon': return balloon(e.text, { x: 0, y: 0, w: e.w, tail: e.tail, fs: e.fs });
    case 'scene': return sceneBand(e.key, { top: 0, h: e.h, align: e.align || 'Max' });
    case 'msg': return e.who === 'me' ? '<div class="msg me"><div class="say">' + nl(e.text) + '</div></div>' : '<div class="msg" style="--nc:' + FR[e.who].fg + '">' + head(e.who, 96) + '<div class="say"><i>' + esc(NAMES[e.who]) + '</i>' + nl(e.text) + '</div></div>';
    case 'rect': return '<div style="position:absolute;inset:0;' + (e.style || '') + '">' + (e.inner || '') + '</div>';
    case 'note': return '<div style="transform:rotate(' + (e.rot || -2) + 'deg)"><div class="paper" style="position:relative;padding:44px 44px 36px"><div class="tape"></div><h3 style="font-size:' + (e.tfs || 64) + 'px">' + nl(e.title) + '</h3>' + e.lines.map(l => '<p style="font-size:' + (e.fs || 40) + 'px" data-l>' + esc(l) + '</p>').join('') + '</div></div>';
    case 'brand': return '<div style="text-align:center"><div style="width:' + (e.w * 0.36) + 'px;height:' + (e.w * 0.36) + 'px;margin:0 auto 30px;filter:drop-shadow(10px 10px 0 #1d1d1b)">' + LOGO.replace('stroke="#fff6e6"', 'stroke="#1d1d1b"').replace(/stroke="#fff6e6"/g, 'stroke="#1d1d1b"') + '</div><h1 class="big" style="--fs:' + (e.fs || 150) + 'px;text-align:center">Die Donut<br>Clique</h1></div>';
    case 'host': return '<div class="host" style="position:static">' + head('leo', 104) + '<b>Leo erzählt</b></div>';
    default: return '';
  }
}
window.buildEls = function (els) {
  const anims = [];
  const html = els.map((e, i) => {
    (e.a || []).forEach(a => anims.push(['#e' + i].concat(a)));
    const h = e.h !== undefined ? e.h : (e.k === 'fig' ? e.w * 1.2 : e.k === 'burst' ? (e.w || 420) * 0.8 : undefined);
    return '<div id="e' + i + '" class="abs" style="' + st({ left: e.x || 0, top: e.y || 0, width: e.w, height: h, 'z-index': e.z || (i + 2), 'transform-origin': e.o || '50% 50%' }) + '">' + elInner(e) + '</div>';
  }).join('');
  return { html, anims };
};
window.H = { fig, head, burst, balloon, sceneBand, confetti, LOGO, portrait, esc, nl };
