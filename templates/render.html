<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Luckiest Guy";src:url(fonts/luckiest-guy-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:700;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:800;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:900;src:url(fonts/nunito-latin-900-normal.woff2) format("woff2")}
:root{--ink:#1d1d1b;--petrol:#1f6f78;--petrol2:#cfe7e6;--coral:#ff7a5c;--coral2:#ffd9cf;--cream:#fff6e6;--mustard:#e8b22c;--mustard2:#f8e3a6;--mint:#7fd6b5;--display:"Luckiest Guy",Impact,sans-serif;--sans:Nunito,Arial,sans-serif;--b:9px;--sh:12px 12px 0 var(--ink)}
*{box-sizing:border-box}
html,body{margin:0}
body{width:1080px;height:1350px;overflow:hidden;font-family:var(--sans);color:var(--ink);background:var(--bg,var(--cream))}
.frame{position:absolute;inset:0;display:flex;flex-direction:column;padding:64px 64px 0}
.kicker{align-self:flex-start;font:900 30px var(--sans);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--cream);padding:10px 22px;border-radius:999px}
h1{font:400 112px/1.0 var(--display);margin:34px 0 0;letter-spacing:.01em}
h2{font:400 84px/1.0 var(--display);margin:0}
.sub{font:800 52px/1.25 var(--sans);margin-top:36px}
.card{background:#fff;border:var(--b) solid var(--ink);border-radius:36px;box-shadow:var(--sh)}
.foot{position:absolute;left:0;right:0;bottom:0;height:120px;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:space-between;padding:0 64px}
.logo{display:flex;align-items:center;gap:20px;font:400 50px var(--display);letter-spacing:.02em}
.logo svg{width:70px;height:70px}
.count{font:900 30px var(--sans);opacity:.85}
.head{width:200px;height:200px;border-radius:50%;border:var(--b) solid var(--ink);overflow:hidden;background:var(--hb)}
.head svg{width:100%;height:100%;display:block}
/* title */
.heads{display:flex;justify-content:space-between;margin-top:auto;margin-bottom:190px}
.heads .head{box-shadow:var(--sh);width:210px;height:210px}
/* profile */
.pro{display:flex;gap:48px;margin-top:32px;align-items:flex-end}
.pro .big{width:380px;height:456px;background:var(--hb);border:var(--b) solid var(--ink);border-radius:36px;box-shadow:var(--sh);overflow:hidden;flex:none}
.pro .big svg{width:100%;height:100%;display:block}
.pro .nm{padding-bottom:10px}
.role{display:inline-block;margin-top:18px;font:900 38px var(--sans);background:var(--hf);color:var(--cream);padding:8px 22px;border-radius:16px;border:6px solid var(--ink)}
.facts{margin-top:40px;padding:26px 40px}
.facts div{display:flex;gap:24px;font:700 36px/1.28 var(--sans);padding:10px 0}
.facts div+div{border-top:4px dashed #d6cdbb}
.facts b{flex:none;width:200px;font-weight:900;text-transform:uppercase;font-size:30px;letter-spacing:.05em;padding-top:6px;color:var(--hf)}
.quote{margin-top:36px;font:400 52px/1.1 var(--display);color:var(--hf)}
/* note */
.paper{position:relative;margin-top:40px;background:#fffdf6;border:var(--b) solid var(--ink);border-radius:18px;box-shadow:var(--sh);padding:64px 64px 50px;transform:rotate(-1.6deg);background-image:repeating-linear-gradient(transparent 0 63px,#cfe7e6 63px 67px);background-position:0 40px}
.paper:before{content:"";position:absolute;top:-34px;left:50%;width:220px;height:62px;margin-left:-110px;background:rgba(232,178,44,.75);border:5px solid var(--ink);transform:rotate(3deg)}
.paper h2{font-size:76px;margin-bottom:24px}
.paper p{margin:0;font:800 41px/67px var(--sans);min-height:67px;white-space:pre}
.stamp{position:absolute;right:20px;bottom:-56px;transform:rotate(-7deg);font:400 46px var(--display);background:var(--coral);color:var(--cream);border:var(--b) solid var(--ink);padding:16px 30px 8px;border-radius:18px;box-shadow:8px 8px 0 var(--ink)}
.owner{position:absolute;left:64px;bottom:150px;display:flex;align-items:center;gap:22px;font:900 36px var(--sans)}
.owner .head{width:120px;height:120px;border-width:7px}
/* scene */
.scene{margin:40px -64px 0;height:520px;border-top:var(--b) solid var(--ink);border-bottom:var(--b) solid var(--ink);overflow:hidden;background:#cfe7e6}
.scene svg{width:100%;height:100%;display:block}
.place{margin-top:44px;font:900 46px/1.25 var(--sans)}
.txt{margin-top:22px;font:700 44px/1.35 var(--sans)}
.bub{display:flex;gap:28px;align-items:flex-start;margin-top:40px}
.bub .head{width:150px;height:150px;flex:none}
.bub .say{position:relative;background:#fff;border:var(--b) solid var(--ink);border-radius:32px;padding:28px 36px;font:800 44px/1.3 var(--sans);box-shadow:8px 8px 0 var(--ink)}
.punch{margin-top:auto;margin-bottom:156px;padding-top:24px;font:400 64px/1.05 var(--display);color:var(--petrol)}
/* finale chat */
.fin .scene{height:330px;margin-top:-64px;border-top:0}
.chat{display:flex;flex-direction:column;gap:14px;margin-top:30px}
.msg{display:flex;gap:16px;align-items:center}
.msg .head{width:78px;height:78px;border-width:6px;flex:none}
.msg .say{background:#fff;border:6px solid var(--ink);border-radius:24px;padding:10px 22px;font:800 34px/1.2 var(--sans)}
.msg .say i{display:block;font:900 22px var(--sans);font-style:normal;letter-spacing:.05em;text-transform:uppercase;color:var(--hf)}
.msg.me{justify-content:flex-end}
.msg.me .say{background:var(--coral);color:var(--cream)}
.fin .punch{margin-bottom:146px;font-size:56px}
.group{align-self:center;font:900 26px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#6d6a62;margin-top:18px}
/* quiz */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px}
.qgrid .card{padding:22px;display:flex;flex-direction:column;align-items:center;gap:16px;background:var(--hb)}
.qgrid .head{width:170px;height:170px;background:#fff}
.qgrid b{font:400 52px var(--display)}
.qgrid span{font:800 34px var(--sans)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const FRIEND = { mila:{bg:'#cfe7e6',fg:'#1f6f78'}, jonas:{bg:'#ffd9cf',fg:'#b8432a'}, aysha:{bg:'#f8e3a6',fg:'#8a6510'}, leo:{bg:'#7fd6b5',fg:'#1f6f78'}, vreni:{bg:'#fff6e6',fg:'#a8452c'}, me:{bg:'#ffd9cf',fg:'#ff7a5c'} };
const NAMES = { mila:'Mila', jonas:'Jonas', aysha:'Aysha', leo:'Leo', vreni:'Tante Vreni', me:'Du' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function portrait(who, head) { return '<svg viewBox="' + (head ? '36 24 128 128' : '0 0 200 240') + '" xmlns="http://www.w3.org/2000/svg">' + (window.P[who] || '') + '</svg>'; }
function headEl(who) { const f = FRIEND[who]; return '<div class="head" style="--hb:' + f.bg + '">' + portrait(who, true) + '</div>'; }
const LOGO = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#e8a961" stroke="#fff6e6" stroke-width="7"/><path d="M14 46 Q20 18 50 14 Q82 16 87 46 Q78 40 70 48 Q60 40 50 48 Q40 40 30 48 Q22 40 14 46Z" fill="#ff7a5c" stroke="#fff6e6" stroke-width="5" stroke-linejoin="round"/><circle cx="50" cy="50" r="13" fill="#1d1d1b" stroke="#fff6e6" stroke-width="6"/></svg>';
function foot(n, total) { return '<div class="foot"><div class="logo">' + LOGO + 'Die Donut Clique</div><div class="count">' + esc(window.SERIES) + ' · ' + n + '/' + total + '</div></div>'; }
function scene(key) { return '<div class="scene">' + window.S[key].replace(/<div class="scene"[^>]*>|<\/div>$/g, '').replace('preserveAspectRatio="xMidYMax slice"', 'preserveAspectRatio="xMidYMid slice"') + '</div>'; }

const L = {
  title: p => '<div class="frame"><div class="kicker">' + esc(p.kicker) + '</div><h1>' + esc(p.title) + '</h1><div class="sub">' + esc(p.sub) + '</div><div class="heads">' + p.heads.map(headEl).join('') + '</div></div>',
  quiz: p => '<div class="frame"><div class="kicker">' + esc(p.kicker) + '</div><h1 style="font-size:92px">' + esc(p.title) + '</h1><div class="qgrid">' + p.options.map(o => '<div class="card" style="--hb:' + FRIEND[o[0]].bg + '">' + headEl(o[0]) + '<b>' + esc(o[1]) + '</b><span>' + esc(o[2]) + '</span></div>').join('') + '</div></div>',
  profile: p => { const f = FRIEND[p.who]; return '<div class="frame" style="--hb:' + f.bg + ';--hf:' + f.fg + '"><div class="kicker">' + esc(window.SERIES) + '</div><div class="pro"><div class="big">' + portrait(p.who) + '</div><div class="nm"><h1 style="margin:0;font-size:' + (p.name.length > 6 ? 88 : 120) + 'px">' + esc(p.name) + '</h1><div class="role">' + esc(p.role) + '</div></div></div><div class="card facts">' + p.facts.map(x => '<div><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>').join('') + '</div><div class="quote">«' + esc(p.quote) + '»</div></div>'; },
  note: p => { const f = FRIEND[p.who]; return '<div class="frame" style="--hf:' + f.fg + '"><div class="kicker">Fundstück</div><div class="paper"><h2>' + esc(p.title) + '</h2>' + p.lines.map(l => '<p>' + esc(l) + '</p>').join('') + '<div class="stamp">' + esc(p.stamp) + '</div></div><div class="owner">' + headEl(p.who) + 'gehört: ' + esc(NAMES[p.who]) + '</div></div>'; },
  scene: p => { const f = FRIEND[p.who || 'me']; return '<div class="frame" style="--hf:' + f.fg + '"><div class="kicker">Der Sommer</div>' + scene(p.scene) + '<div class="place">' + esc(p.place) + '</div>' + (p.text ? '<div class="txt">' + esc(p.text) + '</div>' : '') + (p.bubble ? '<div class="bub">' + headEl(p.who) + '<div class="say">' + esc(p.bubble) + '</div></div>' : '') + '<div class="punch">' + esc(p.punch) + '</div></div>'; },
  finale: p => '<div class="frame fin">' + scene(p.scene) + '<div class="group">Neue Gruppe: Donut Clique</div><div class="chat">' + p.chat.map(m => m[0] === 'me' ? '<div class="msg me"><div class="say">' + esc(m[1]) + '</div></div>' : '<div class="msg" style="--hf:' + FRIEND[m[0]].fg + '">' + headEl(m[0]) + '<div class="say"><i>' + esc(NAMES[m[0]]) + '</i>' + esc(m[1]) + '</div></div>').join('') + '</div><div class="punch">' + esc(p.punch) + '</div></div>'
};
window.renderPost = function (p, n, total) {
  const bg = { title:'#fff6e6', quiz:'#fff6e6', profile: (FRIEND[p.who] || {}).bg, note:'#cfe7e6', scene:'#fff6e6', finale:'#f8e3a6' }[p.layout];
  document.body.style.setProperty('--bg', p.layout === 'profile' ? '#fff6e6' : bg);
  document.getElementById('root').innerHTML = L[p.layout](p) + foot(n, total);
  return document.fonts.ready.then(() => true);
};
</script>
</body>
</html>
